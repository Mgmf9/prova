<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Folhas da prova</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Folhas da prova</h1>
  <p class="sub">Anexe as fotos da prova e receba as respostas em folhas com letra manuscrita.</p>

  <section>
    <div class="btns">
      <label class="drop" for="file">
        <span>Escolher da galeria</span>
        <small>Várias de uma vez (até 12)</small>
      </label>
      <label class="drop" for="cam">
        <span>Tirar foto agora</span>
        <small>Abre a câmera do aparelho</small>
      </label>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <input id="cam" type="file" accept="image/*" capture="environment" hidden>
    <div id="thumbs"></div>
    <label class="txtl" for="txt">Ou digite aqui: questões da prova, um exercício, ou o que você quer que seja escrito (pode usar junto com as fotos)</label>
    <textarea id="txt" rows="6"></textarea>
    <label class="check"><input id="compact" type="checkbox" checked> Nas questões de marcar, só número e letra</label>
    <button id="go" type="button">Gerar folhas</button>
    <p id="status" role="status"></p>
  </section>

  <div id="results"></div>
</main>
<script src="app.js"></script>
</body>
</html>
